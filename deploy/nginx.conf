server {
    listen 80;
    server_name _;

    # The builder atomically swaps this symlink after each successful build
    # (see deploy/builder/rebuild.sh), so nginx always serves a complete,
    # never-half-built release.
    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # Astro's build hashes filenames under /_astro/, so these are safe to
    # cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }
}
